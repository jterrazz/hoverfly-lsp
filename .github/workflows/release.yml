name: Release

# outside: creating a GitHub Release publishes to npm tokenlessly, through OIDC trusted publishing
# (`--provenance` and `id-token: write`, configured once on npmjs.com for this repository and this
# workflow). The single-package release-npm workflow cannot serve a monorepo: this one publishes
# @jterrazz/hoverfly-lsp alone and attaches the .vsix; the editor registries stay manual
# (docs/guides/release.md).

on:
    release:
        # outside: `published` fires for a release published at once or saved as a draft first;
        # `created` misses the draft.
        types: [published]

jobs:
    # invariant: a release whose commit fails the shared gate never publishes.
    validate:
        uses: jterrazz/studio-actions/.github/workflows/validate.yaml@main
        with:
            node-version: '24'

    publish:
        name: Publish
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: write # upload the .vsix asset onto the release
            id-token: write # npm provenance + OIDC trusted publishing (no token needed)
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install
              run: npm ci

            - name: Build
              run: npm run build

            # invariant: the tag names the npm version; the editor artefacts version on their own
            # registries, whose versions are immutable, so they are not checked here.
            - name: Verify release tag matches the npm package versions
              env:
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: |
                  TAG="${TAG_NAME#v}"
                  echo "Release version: $TAG"
                  fail=0
                  check() {
                    local file="$1" actual
                    actual="$(node -p "require('./$file').version")"
                    if [ "$actual" != "$TAG" ]; then
                      echo "::error file=$file::version $actual != release $TAG"
                      fail=1
                    else
                      echo "ok: $file @ $actual"
                    fi
                  }
                  check packages/analysis/package.json
                  check packages/server/package.json
                  exit $fail

            # value: idempotent. A version already on npm is skipped, so cutting the GitHub release still
            # attaches the .vsix; the analysis package is private and inlined in the server's bundle.
            - name: Publish @jterrazz/hoverfly-lsp (skip if already on npm)
              run: |
                  VER="$(node -p "require('./packages/server/package.json').version")"
                  if npm view "@jterrazz/hoverfly-lsp@$VER" version >/dev/null 2>&1; then
                    echo "@jterrazz/hoverfly-lsp@$VER is already published; skipping publish."
                  else
                    npm publish --workspace @jterrazz/hoverfly-lsp --access public --provenance
                  fi

            - name: Package VS Code extension
              run: npm run package --workspace hoverfly-lsp-vscode

            - name: Attach .vsix to the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: gh release upload "$TAG_NAME" editors/vscode/.artifacts/vsce/*.vsix --clobber
